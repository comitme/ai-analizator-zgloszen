[project]
name = "ticket-triage"
version = "0.3.0"
description = "AI-assisted triage of e-commerce customer tickets: classify, check return policy, draft a reply, escalate when unsure."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.40",
    "pandas>=2.2",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    # Tests that call the real Anthropic API and cost money.
    # Excluded from the default run: `pytest -m "not llm"` is what `make test` does.
    "llm: hits the live Anthropic API (requires ANTHROPIC_API_KEY, costs money)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
