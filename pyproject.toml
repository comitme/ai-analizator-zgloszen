[project]
name = "ticket-triage"
version = "0.5.0"
description = "AI-assisted triage of e-commerce customer tickets: classify, check return policy, draft a reply, escalate when unsure."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# The panel's own dependencies - its Docker image installs exactly this list, so
# it must be complete on its own (httpx is here even though the base list also has it).
ui = [
    "streamlit>=1.40",
    "pandas>=2.2",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    # Tests that call the real Anthropic API and cost money.
    # Excluded from the default run: `pytest -m "not llm"` is what `make test` does.
    "llm: hits the live Anthropic API (requires ANTHROPIC_API_KEY, costs money)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# `ui` to nasz pakiet w katalogu głównym, nie biblioteka zewnętrzna.
known-first-party = ["ticket_triage", "ui"]
